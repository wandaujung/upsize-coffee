
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: upsize-app

    ports:
      - "8000:8000"
      - "5173:5173"

    volumes:
      - .:/var/www

    env_file:
      - .env.docker

    depends_on:
      - mysql
      - notification-service

    networks:
      - upsize-network

  mysql:
    image: mysql:8.0

    container_name: upsize-mysql

    restart: always

    environment:
      MYSQL_DATABASE: upsize
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - upsize-network

  notification-service:
    build:
      context: ../UpSize-Notification-Service
      dockerfile: Dockerfile

    container_name: upsize-notification-service

    ports:
      - "8001:8001"

    networks:
      - upsize-network

  rabbitmq:
    image: rabbitmq:3-management

    container_name: upsize-rabbitmq

    restart: unless-stopped

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: upsize
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    networks:
      - upsize-network

  event-consumer:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: upsize-event-consumer

    restart: unless-stopped

    command: php artisan rabbitmq:consume-orders

    working_dir: /var/www

    volumes:
      - .:/var/www

    env_file:
      - .env.docker

    depends_on:
      - mysql
      - rabbitmq

    networks:
      - upsize-network

volumes:
  mysql-data:
  rabbitmq-data:

networks:
  upsize-network:
    driver: bridge
